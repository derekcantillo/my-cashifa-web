<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cashifa</title>
    <script>
      // Apply the theme before first paint to avoid a flash. Mirrors src/theme/themeStore.ts
      // (key `cashifa:theme`: 'light' | 'dark' | 'system'; the legacy `cashifa-theme`
      // zustand entry is migrated there by the app on boot).
      ;(function () {
        var theme = 'system'
        try {
          theme = localStorage.getItem('cashifa:theme')
          if (!theme) {
            var legacy = JSON.parse(localStorage.getItem('cashifa-theme') || 'null')
            theme = legacy && legacy.state && legacy.state.theme
          }
        } catch (e) {}
        var dark =
          theme === 'dark' ||
          (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        try {
          var lang =
            localStorage.getItem('cashifa:lang') || localStorage.getItem('cashifa-language')
          if (lang === 'es' || lang === 'en') document.documentElement.lang = lang
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
